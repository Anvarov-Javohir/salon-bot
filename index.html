<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dilya Ledy Salon</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        h1 {
            color: #ff69b4;
            font-size: 22px;
            margin-bottom: 5px;
        }
        p {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .gallery {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .gallery img {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(255, 105, 180, 0.2);
        }

</head>

    <h1>🌸 Dilya Ledy Salon</h1>
    <p>Xizmatlarimiz va ish jarayonlarimiz bilan tanishing</p>

    <div class="gallery">
        <img src="Xizmat va narxlar.jpg" alt="Xizmatlar va narxlar">
        <img src="ish1.jpg" alt="Ish namunasi 1">
        <img src="ish2.jpg" alt="Ish namunasi 2">
        <img src="ish3.jpg" alt="Ish namunasi 3">
        <img src="ish4.jpg" alt="Ish namunasi 4">
        <img src="ish5.jpg" alt="Ish namunasi 5">

</html>
